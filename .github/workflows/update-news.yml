name: Update news

on:
  schedule:
    - cron: "15 6 * * *"   # every day at 06:15 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    paths:
      - feeds.json
      - scripts/fetch_news.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feeds
        run: python scripts/fetch_news.py
      - name: Commit if anything changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || git commit -m "Update news $(date -u +'%Y-%m-%d')"
          git push
